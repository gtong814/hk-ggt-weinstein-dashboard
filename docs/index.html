<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全量港股通 Stan Weinstein 现代版选股看板</title>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e;
      --up: #22c55e; --down: #ef4444; --warn: #f59e0b; --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1360px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    h1 { margin: 0; font-size: 1.45rem; }
    .meta { color: var(--muted); font-size: 0.86rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .card-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .card-val { font-size: 1.35rem; font-weight: 700; }
    .card-sub { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
    .badge-up { background: rgba(34,197,94,0.16); color: var(--up); }
    .badge-down { background: rgba(239,68,68,0.16); color: var(--down); }
    .badge-warn { background: rgba(245,158,11,0.16); color: var(--warn); }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: 0.15s; }
    .tab-btn:hover { color: var(--text); border-color: var(--accent); }
    .tab-btn.active { background: #1f2937; color: var(--text); border-color: var(--accent); }
    .search { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; width: 250px; font-size: 0.9rem; }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; background: #121720; cursor: pointer; user-select: none; }
    th:hover { color: var(--text); }
    tr:hover td { background: rgba(56,189,248,0.06); }
    a.ticker-link { color: var(--accent); text-decoration: none; font-weight: 700; }
    a.ticker-link:hover { text-decoration: underline; }
    .empty { text-align: center; padding: 36px; color: var(--muted); }
    footer { margin-top: 22px; text-align: center; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>全量港股通 Stan Weinstein 现代版选股看板</h1>
    <div class="meta" id="metaInfo"></div>
  </header>

  <section class="grid" id="kpiGrid"></section>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="searchInput" type="text" placeholder="搜索代码或名称 (如 0700 / 腾讯)" />
  </div>

  <div class="table-wrap">
    <table id="dataTable"></table>
  </div>

  <footer>数据来源：港交所/深交所官方港股通名单 & Yahoo Finance ｜ 点击表头可排序 ｜ 配色：绿涨红跌 ｜ 仅供技术面量化复盘参考</footer>
</div>

<script>
const DATA = {"updated_at": "2026-11-27 20:39 HKT", "trade_date": "2026-11-27", "source_name": "港交所披露易官方", "universe": {"total_listed": 987, "total_fetched": 848, "liquid_count": 346, "breadth_ma50": 26.6, "breadth_ma200": 20.5}, "benchmark": {"symbol": "2800.HK", "label": "盈富基金 / 恒指代理", "close": 22.84, "pct_chg": 1.96, "long_bull": false, "short_bull": false}, "stage2": [], "gap_watch": [], "stage4b": [], "risk": [{"ticker": "0290.HK", "name": "國富量子", "url": "https://www.tradingview.com/chart/?symbol=HKEX:290", "close": 2.14, "pct_chg": 5.41, "ma50": 1.63, "dist_ma50": 31.5, "vol_ratio": 3.32, "turnover_m": 35.8, "signal": "分批止盈(乖离率过高(31.5%))"}, {"ticker": "0941.HK", "name": "中國移動", "url": "https://www.tradingview.com/chart/?symbol=HKEX:941", "close": 77.75, "pct_chg": -1.08, "ma50": 79.52, "dist_ma50": -2.2, "vol_ratio": 1.99, "turnover_m": 1210.4, "signal": "50MA反抽受阻(彻底清仓)"}, {"ticker": "0293.HK", "name": "國泰航空", "url": "https://www.tradingview.com/chart/?symbol=HKEX:293", "close": 14.17, "pct_chg": 0.5, "ma50": 14.35, "dist_ma50": -1.2, "vol_ratio": 1.86, "turnover_m": 406.5, "signal": "刚有效跌破50MA(离场)"}, {"ticker": "2419.HK", "name": "德康農牧", "url": "https://www.tradingview.com/chart/?symbol=HKEX:2419", "close": 51.3, "pct_chg": -2.93, "ma50": 56.36, "dist_ma50": -9.0, "vol_ratio": 1.59, "turnover_m": 54.8, "signal": "50MA反抽受阻(彻底清仓)"}, {"ticker": "9858.HK", "name": "優然牧業", "url": "https://www.tradingview.com/chart/?symbol=HKEX:9858", "close": 3.68, "pct_chg": -2.9, "ma50": 3.79, "dist_ma50": -3.0, "vol_ratio": 1.54, "turnover_m": 74.1, "signal": "50MA反抽受阻(彻底清仓)"}, {"ticker": "6681.HK", "name": "腦動極光-B", "url": "https://www.tradingview.com/chart/?symbol=HKEX:6681", "close": 1.61, "pct_chg": -3.01, "ma50": 1.22, "dist_ma50": 32.3, "vol_ratio": 1.45, "turnover_m": 389.9, "signal": "分批止盈(乖离率过高(32.3%))"}, {"ticker": "1333.HK", "name": "博雷頓", "url": "https://www.tradingview.com/chart/?symbol=HKEX:1333", "close": 20.06, "pct_chg": 0.3, "ma50": 16.03, "dist_ma50": 25.2, "vol_ratio": 1.25, "turnover_m": 86.0, "signal": "分批止盈(乖离率过高(25.2%))"}, {"ticker": "2245.HK", "name": "力勤資源", "url": "https://www.tradingview.com/chart/?symbol=HKEX:2245", "close": 17.62, "pct_chg": 0.97, "ma50": 18.15, "dist_ma50": -2.9, "vol_ratio": 1.24, "turnover_m": 55.4, "signal": "50MA反抽受阻(彻底清仓)"}, {"ticker": "0857.HK", "name": "中國石油股份", "url": "https://www.tradingview.com/chart/?symbol=HKEX:857", "close": 9.7, "pct_chg": -0.72, "ma50": 9.96, "dist_ma50": -2.5, "vol_ratio": 1.1, "turnover_m": 1159.5, "signal": "50MA反抽受阻(彻底清仓)"}, {"ticker": "0902.HK", "name": "華能國際電力股份", "url": "https://www.tradingview.com/chart/?symbol=HKEX:902", "close": 5.83, "pct_chg": -1.19, "ma50": 5.98, "dist_ma50": -2.4, "vol_ratio": 0.92, "turnover_m": 152.0, "signal": "50MA反抽受阻(彻底清仓)"}, {"ticker": "0696.HK", "name": "中國民航信息網絡", "url": "https://www.tradingview.com/chart/?symbol=HKEX:696", "close": 9.1, "pct_chg": 1.62, "ma50": 9.12, "dist_ma50": -0.2, "vol_ratio": 0.49, "turnover_m": 33.3, "signal": "刚有效跌破50MA(离场)"}, {"ticker": "2583.HK", "name": "西普尼", "url": "https://www.tradingview.com/chart/?symbol=HKEX:2583", "close": 74.25, "pct_chg": 3.34, "ma50": 51.79, "dist_ma50": 43.4, "vol_ratio": 0.44, "turnover_m": 54.8, "signal": "分批止盈(乖离率过高(43.4%))"}]};

const TABS = [
  { key: "stage2", label: "Stage 2 突破", cols: [
    ["ticker", "代码 (TV图表)"], ["name", "名称"], ["close", "收盘价"], ["pct_chg", "涨跌幅%"],
    ["type", "突破类型"], ["vol_ratio", "量比(50MA)"], ["dist_ma50", "距50MA%"],
    ["mrs", "MRS强度"], ["stoch_k", "StochK"], ["turnover_m", "20日均额(M)"], ["room", "上方空间"]
  ]},
  { key: "gap_watch", label: "缺口回调观察", cols: [
    ["ticker", "代码 (TV图表)"], ["name", "名称"], ["close", "收盘价"], ["pct_chg", "涨跌幅%"],
    ["gap_date", "跳空日期"], ["gap_pct", "跳空幅度%"], ["gap_zone", "未补缺口区间"],
    ["mrs", "MRS强度"], ["turnover_m", "20日均额(M)"], ["status", "追踪状态"]
  ]},
  { key: "stage4b", label: "4B- 底部反转", cols: [
    ["ticker", "代码 (TV图表)"], ["name", "名称"], ["close", "收盘价"], ["pct_chg", "涨跌幅%"],
    ["room_200", "距200MA空间%"], ["dd_52w", "52周回撤%"], ["vol_ratio", "量比(50MA)"],
    ["stop_ref", "参考止损"], ["target_ref", "近200MA目标"], ["turnover_m", "20日均额(M)"]
  ]},
  { key: "risk", label: "50MA 风控 / 止盈", cols: [
    ["ticker", "代码 (TV图表)"], ["name", "名称"], ["close", "收盘价"], ["pct_chg", "涨跌幅%"],
    ["ma50", "50日均线"], ["dist_ma50", "距50MA%"], ["vol_ratio", "量比(50MA)"],
    ["turnover_m", "20日均额(M)"], ["signal", "风控信号"]
  ]}
];

let activeKey = "stage2";
let sortState = { col: null, asc: false };

function fmtPct(v) {
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "");
  const sign = v > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${v}%</span>`;
}

function renderHeader() {
  const b = DATA.benchmark, u = DATA.universe;
  document.getElementById("metaInfo").innerText =
    `行情日期：${DATA.trade_date} ｜ 更新：${DATA.updated_at} ｜ 名单源：${DATA.source_name}（达标流动股 ${u.liquid_count} / 有效数据 ${u.total_fetched} / 总名单 ${u.total_listed}）`;

  const longTag = b.long_bull ? `<span class="badge badge-up">长牛 (200MA上行)</span>` : `<span class="badge badge-down">防守 (200MA偏弱)</span>`;
  const shortTag = b.short_bull ? `<span class="badge badge-up">短多 (站上50MA)</span>` : `<span class="badge badge-warn">短线回调 (破50MA)</span>`;

  document.getElementById("kpiGrid").innerHTML = `
    <div class="card">
      <div class="card-label">${b.label} (${b.symbol})</div>
      <div class="card-val">${b.close} <span style="font-size:0.95rem">${fmtPct(b.pct_chg)}</span></div>
      <div class="card-sub">${longTag} ${shortTag}</div>
    </div>
    <div class="card">
      <div class="card-label">全量港股通市场广度</div>
      <div class="card-val ${u.breadth_ma50 >= 50 ? 'up' : 'down'}">${u.breadth_ma50}%</div>
      <div class="card-sub">站上 50MA 占比 ｜ 站上 200MA：${u.breadth_ma200}%</div>
    </div>
    <div class="card">
      <div class="card-label">多头机会命中</div>
      <div class="card-val up">${DATA.stage2.length + DATA.gap_watch.length} 只</div>
      <div class="card-sub">Stage 2 突破 ${DATA.stage2.length} ｜ 缺口观察 ${DATA.gap_watch.length}</div>
    </div>
    <div class="card">
      <div class="card-label">超跌博弈 / 新鲜风控警报</div>
      <div class="card-val warn">${DATA.stage4b.length} / <span class="down">${DATA.risk.length}</span></div>
      <div class="card-sub">4B- 反转 ${DATA.stage4b.length} ｜ 50MA/止盈警报 ${DATA.risk.length}</div>
    </div>
  `;
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t => `
    <button class="tab-btn ${t.key === activeKey ? 'active' : ''}" onclick="switchTab('${t.key}')">
      ${t.label} (${DATA[t.key].length})
    </button>
  `).join("");
}

function switchTab(k) {
  activeKey = k;
  sortState = { col: null, asc: false };
  renderTabs();
  renderTable();
}

function sortBy(col) {
  if (sortState.col === col) sortState.asc = !sortState.asc;
  else { sortState.col = col; sortState.asc = false; }
  renderTable();
}

function renderTable() {
  const tab = TABS.find(t => t.key === activeKey);
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let rows = DATA[activeKey].filter(r =>
    !q || r.ticker.toLowerCase().includes(q) || (r.name && r.name.toLowerCase().includes(q))
  );

  if (sortState.col) {
    const col = sortState.col, dir = sortState.asc ? 1 : -1;
    rows = [...rows].sort((a, b) => {
      const va = a[col], vb = b[col];
      if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
      return String(va).localeCompare(String(vb), "zh-HK") * dir;
    });
  }

  const thead = `<thead><tr>${tab.cols.map(([k, label]) => {
    const arrow = sortState.col === k ? (sortState.asc ? " ▲" : " ▼") : "";
    return `<th onclick="sortBy('${k}')">${label}${arrow}</th>`;
  }).join("")}</tr></thead>`;

  if (!rows.length) {
    document.getElementById("dataTable").innerHTML =
      thead + `<tbody><tr><td colspan="${tab.cols.length}" class="empty">当日暂无符合条件的标的</td></tr></tbody>`;
    return;
  }

  const tbody = rows.map(r => `<tr>${tab.cols.map(([k]) => {
    const val = r[k];
    if (k === "ticker") return `<td><a class="ticker-link" href="${r.url}" target="_blank" rel="noopener">${val}</a></td>`;
    if (k === "pct_chg" || k === "dist_ma50") return `<td>${fmtPct(val)}</td>`;
    if (k === "mrs") return `<td class="${val >= 0 ? 'up' : 'down'}">${val}</td>`;
    if (k === "type" || k === "status") return `<td><span class="badge badge-up">${val}</span></td>`;
    if (k === "signal") return `<td><span class="badge ${val.includes('清仓') || val.includes('离场') ? 'badge-down' : 'badge-warn'}">${val}</span></td>`;
    return `<td>${val}</td>`;
  }).join("")}</tr>`).join("");

  document.getElementById("dataTable").innerHTML = thead + `<tbody>${tbody}</tbody>`;
}

document.getElementById("searchInput").addEventListener("input", renderTable);
renderHeader(); renderTabs(); renderTable();
</script>
</body>
</html>
